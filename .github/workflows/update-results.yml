name: Update La Primitiva results

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # v3 app feed (Primitiva numbers) — must never be broken
      - name: Fetch latest results (SELAE via r.jina.ai)
        run: python3 scripts/update_es.py
      # v4 app feed (Primitiva + Euromillones with the real prizes in Spain)
      - name: Fetch results with prizes (v4)
        run: python3 scripts/es_results.py
      - name: Commit if changed
        run: |
          git config user.name "results-bot"
          git config user.email "actions@github.com"
          git add es_recent.json es_results.json
          if ! git diff --cached --quiet; then
            git commit -m "results: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push
          else
            echo "No change."
          fi
